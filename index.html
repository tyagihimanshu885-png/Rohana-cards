<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Trump Premium - FIXED ROOM</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,system-ui}
body{background:#0e5a2f;min-height:100vh;overflow:hidden;user-select:none}
.felt{position:fixed;inset:0;background:#0e5a2f;display:flex;align-items:center;justify-content:center}
.table{width:100vw;height:100vh;max-width:520px;position:relative;background:radial-gradient(ellipse at center,#1a7a44 0%,#0e5a2f 70%);overflow:hidden}
.player{position:absolute;display:flex;flex-direction:column;align-items:center;gap:5px;z-index:5}
.p-top{top:10px;left:50%;transform:translateX(-50%)}.p-left{left:6px;top:36%;transform:translateY(-50%)}.p-right{right:6px;top:36%;transform:translateY(-50%)}.p-bottom{bottom:0;left:50%;transform:translateX(-50%);width:100%;z-index:20}
.avatar{width:42px;height:42px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#000;border:3px solid #ffca28}.avatar.active{border-color:#00e676;box-shadow:0 0 12px #00e676}
.nameTag{background:rgba(0,0,0,.85);color:#fff;padding:2px 7px;border-radius:8px;font-size:11px;text-align:center;min-width:42px}.nameTag b{color:#ffca28}
.cards{display:flex;justify-content:center}.card{width:46px;height:66px;background:#fff;border-radius:6px;border:1px solid #777;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:2px;font-weight:800;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.4);margin-left:-6px}.card:first-child{margin-left:0}.card.red{color:#d32f2f}.card.black{color:#111}.card.back{background:repeating-linear-gradient(45deg,#1a3a5a,#1a3a5a 4px,#2a5a8a 4px,#2a5a8a 8px);border:2px solid #fff}.card.disabled{opacity:0.25;pointer-events:none;filter:grayscale(1)}
.p-top .card{width:28px;height:38px;margin-left:-14px}.p-left .card,.p-right .card{width:38px;height:28px;margin-left:0;margin-top:-18px}.p-bottom .card{width:8.2vw;max-width:46px;min-width:32px;height:72px;margin-left:-3px}
.centerWrap{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:320px;height:320px;z-index:6;display:flex;align-items:center;justify-content:center}
.trumpCenter{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:120px;opacity:0.28;color:#fff;font-weight:900;pointer-events:none;z-index:1}
.trumpBadge{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:#ffca28;color:#000;padding:3px 10px;border-radius:12px;font-weight:800;font-size:12px;z-index:10}
.centerCards{position:relative;width:100%;height:100%;display:block;z-index:2}.centerCards .card{position:absolute;width:70px;height:94px;margin:0;border-radius:8px;border:2px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center}.centerCards .card .whoLabel{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.9);color:#ffca28;font-size:9px;padding:1px 6px;border-radius:10px;white-space:nowrap;font-weight:700;border:1px solid #ffca28}
.centerCards .card.pos-A{bottom:15px;left:50%;transform:translate(-50%,0)}.centerCards .card.pos-B{left:10px;top:50%;transform:translate(0,-50%)}.centerCards .card.pos-C{top:15px;left:50%;transform:translate(-50%,0)}.centerCards .card.pos-D{right:10px;top:50%;transform:translate(0,-50%)}
.turnBar{position:absolute;left:2%;right:2%;top:62%;background:#ff9800;color:#000;padding:6px 10px;border-radius:4px;font-weight:700;font-size:12px;z-index:15}
.scoreBoard{position:absolute;right:6px;bottom:80px;background:rgba(255,255,255,.96);border:1px solid #000;border-radius:4px;padding:3px;font-size:9px;z-index:25;min-width:132px}.scoreBoard table{width:100%;border-collapse:collapse}.scoreBoard td,.scoreBoard th{border:1px solid #555;padding:2px 4px;text-align:center}
.ui{position:fixed;left:4px;top:4px;background:rgba(0,0,0,.85);color:#fff;padding:6px 8px;border-radius:8px;font-size:9px;min-width:190px;z-index:100}.ui.hideGame{opacity:0;pointer-events:none;transform:translateY(-30px)}
.btn{padding:8px 14px;border-radius:7px;border:none;font-weight:700;cursor:pointer;margin:2px;font-size:13px}.by{background:#ffca28;color:#000}.bg{background:#2e7d32;color:#fff}.bb{background:#1565c0;color:#fff}.br{background:#c62828;color:#fff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:300}.modalBox{background:#123e33;border-radius:12px;padding:14px;max-width:520px;width:94%;border:2px solid #1f6b55;text-align:center;max-height:92vh;overflow:auto}.hidden{display:none}.row{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.lobbyCode{font-size:28px;font-weight:900;background:#ffca28;color:#000;padding:8px 18px;border-radius:10px;letter-spacing:2px;margin:10px 0;display:inline-block}.playerSlot{background:rgba(255,255,255,.1);border:1px dashed #1f6b55;border-radius:8px;padding:8px 10px;margin:4px 0;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#fff}.playerSlot.joined{background:#0e3a2e;border-style:solid;border-color:#2e7d32}
#toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#c62828;color:#fff;padding:14px 22px;border-radius:10px;font-weight:800;font-size:16px;z-index:500;display:none;box-shadow:0 4px 20px rgba(0,0,0,.7);border:2px solid #fff}
#timerBar{position:absolute;top:32%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#ffca28;padding:2px 8px;border-radius:10px;font-weight:800;font-size:13px;z-index:12;border:1px solid #ffca28;display:none}
</style>
</head>
<body>
<div class="felt"><div class="table">
<div class="player p-top" id="seat-C"><div class="avatar" id="av-C">C</div><div class="nameTag" id="tag-C">C<br><b>0/4</b></div><div class="cards" id="hand-C"></div></div>
<div class="player p-left" id="seat-B"><div class="avatar" id="av-B">B</div><div class="nameTag" id="tag-B">B<br><b>0/3</b></div><div class="cards" id="hand-B"></div></div>
<div class="player p-right" id="seat-D"><div class="avatar" id="av-D">D</div><div class="nameTag" id="tag-D">D<br><b>0/2</b></div><div class="cards" id="hand-D"></div></div>
<div class="centerWrap"><div id="trumpBadge" class="trumpBadge">TRUMP: ?</div><div id="trumpCenter" class="trumpCenter"></div><div id="timerBar">30s</div><div id="centerCards" class="centerCards"></div></div>
<div id="turnBar" class="turnBar hidden">Your turn!</div>
<div class="player p-bottom" id="seat-A"><div class="avatar" id="av-A">A</div><div class="nameTag" id="tag-A">A<br><b>0/4</b></div><div class="scoreBoard"><table><tr><th>Player</th><th>Score</th><th>Bagh</th></tr><tr><td id="p0">A</td><td id="sc0">0</td><td id="bg0">0</td></tr><tr><td id="p1">B</td><td id="sc1">0</td><td id="bg1">0</td></tr><tr><td id="p2">C</td><td id="sc2">0</td><td id="bg2">0</td></tr><tr><td id="p3">D</td><td id="sc3">0</td><td id="bg3">0</td></tr></table></div><div class="cards" id="hand-A"></div></div>
</div></div>
<div id="toast">NOT YOUR TURN</div>
<div class="ui" id="uiBox"><div><b>Room:</b> <span id="roomIdTxt">-</span> <button class="btn by" onclick="copyRoom()">COPY</button> <button class="btn bb" onclick="shareWA()">WA</button> <button class="btn bg" onclick="showHistory()">HISTORY</button></div><div>Game <b id="gno">1</b>/15 | Dealer <b id="dealer">-</b> | Bidder <b id="bidder">-</b></div><div>Trump: <b id="trump">?</b> | <span id="phase">Lobby</span></div><div id="bids"></div><div id="scores"></div></div>
<div id="modal" class="modal"><div class="modalBox"><h3 style="color:#ffca28">Trump Premium FIXED</h3><input id="myName" placeholder="Tumhara Naam"><div class="row" style="margin-top:8px"><button class="btn by" onclick="createRoom()">ROOM BANAO</button></div><div class="row"><input id="joinId" placeholder="Room ID" style="flex:1"><button class="btn bb" onclick="joinRoom()">JOIN</button></div><div style="margin-top:8px"><button class="btn bg" onclick="directBotStart()">Direct Bots Se Khelo</button></div><div id="peerStatus" style="font-size:10px;color:#ffca28;margin-top:6px">PeerJS Ready</div></div></div>
<div id="onlineLobby" class="modal hidden"><div class="modalBox"><h3 style="color:#ffca28">Room Ban Gaya</h3><div id="lobbyRoomCode" class="lobbyCode">TRUMP1234</div><div class="row"><button class="btn by" onclick="copyRoom()">COPY</button><button class="btn bb" onclick="shareWA()">WA Share</button></div><div id="lobbyPlayers" style="margin:10px 0;text-align:left"></div><div class="row"><button class="btn bg" onclick="addBotToLobby()">+ Bot Add</button><button class="btn by" onclick="hostStartFromLobby()">START</button></div><div class="row"><button class="btn br" onclick="leaveLobby()">Leave</button></div></div></div>
<div id="waitingLobby" class="modal hidden"><div class="modalBox"><h3 style="color:#ffca28">Joined!</h3><div id="waitingRoomCode" class="lobbyCode">TRUMP1234</div><div id="waitingPlayers" style="margin:10px 0;text-align:left"></div><div style="font-size:12px;color:#0f0" id="waitingStatus">Host START ka wait</div><div class="row" style="margin-top:10px"><button class="btn bb" onclick="retryJoin()">Retry</button><button class="btn br" onclick="leaveLobby()">Leave</button></div></div></div>
<div id="bidModal" class="modal hidden"><div class="modalBox"><h3 id="bidTitle">Bid</h3><div id="bidRoundInfo"></div><div id="bidTrumpInfo"></div><div id="bidCards" class="row"></div><div id="bidBtns"></div><div id="trumpBtns"></div></div></div>
<div id="overcallModal" class="modal hidden"><div class="modalBox"><h3 id="overcallTitle">Kaatna?</h3><div id="overcallInfo"></div><div id="overcallCards" class="row"></div><div id="overcallBtns"></div><div id="overcallTrumpBtns"></div></div></div>
<div id="historyModal" class="modal hidden"><div class="modalBox"><h3>Hisab</h3><div id="historyContent"></div><div><button class="btn bg" onclick="nextRoundStart()">NEXT ROUND</button> <button class="btn by" onclick="closeHistory()">Band</button></div></div></div>
<script>
let myName="",roomId="",peer=null,conns={},isHost=true,players=[],dealer=0,bidder=1,gameNo=1,scores={},extra={},hands={},bids={},trump="",tricksWon={},center=[],turn=0,trick=1,deck=[],isBotGame=true,gameStarted=false,historyLog=[],initialBidder=0,initialBid=0,overcallOrder=[],overcallIdx=0,turnTimer=null,turnTimeLeft=30,originalNames={},bidTimer=null;
const suits=["♠","♥","♦","♣"],ranks=["A","K","Q","J","10","9","8","7","6","5","4","3","2"],pow={A:14,K:13,Q:12,J:11,"10":10,"9":9,"8":8,"7":7,"6":6,"5":5,"4":4,"3":3,"2":2};
function rnd(n){return Math.floor(Math.random()*n)}
function isBotPlayer(name){return !name||name=='B'||name=='C'||name=='D'||name.startsWith('Bot');}
function mkDeck(){let d=[];for(let s of suits){for(let r of ranks){d.push({s:s,r:r,p:pow[r],id:s+"_"+r});}}for(let i=d.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));let t=d[i];d[i]=d[j];d[j]=t;}return d;}
function sortBySuit(a,b){let o={'♠':0,'♥':1,'♦':2,'♣':3};if(o[a.s]!=o[b.s])return o[a.s]-o[b.s];return b.p-a.p;}
function showToast(m){let t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>{t.style.display='none';},2500);}
function startTurnTimer(){clearTurnTimer();turnTimeLeft=30;let tb=document.getElementById('timerBar');if(tb){tb.style.display='block';tb.innerText='30s';}turnTimer=setInterval(()=>{turnTimeLeft--;let tb=document.getElementById('timerBar');if(tb)tb.innerText=turnTimeLeft+'s';if(turnTimeLeft<=0){clearTurnTimer();handleTurnTimeout();}},1000);}
function clearTurnTimer(){if(turnTimer){clearInterval(turnTimer);turnTimer=null;}let tb=document.getElementById('timerBar');if(tb)tb.style.display='none';}
function handleTurnTimeout(){let who=players[turn];if(!who)return;if(isBotPlayer(who)){if(isHost)botPlay();return;}showToast(who+' Bot!');if(isHost){let botName='Bot'+(turn+1);players[turn]=botName;if(hands[who]){hands[botName]=hands[who];delete hands[who];}broadcast({type:'playerReplaced',players:players,hands:hands});updateUI();renderAll();setTimeout(botPlay,800);}}
function startBidTimer(cb){clearBidTimer();bidTimer=setTimeout(()=>{if(cb)cb();},40000);}
function clearBidTimer(){if(bidTimer){clearTimeout(bidTimer);bidTimer=null;}}
function renderLobby(){let html='';for(let i=0;i<4;i++){let p=players[i];if(p){html+='<div class="playerSlot joined">'+(i+1)+'. '+p+' - Joined</div>';}else{html+='<div class="playerSlot">'+(i+1)+'. Waiting...</div>';}}document.getElementById('lobbyPlayers').innerHTML=html;document.getElementById('waitingPlayers').innerHTML=html;}
function directBotStart(){myName=document.getElementById('myName').value.trim()||'Player';roomId='TRUMP'+(rnd(9000)+1000);document.getElementById('roomIdTxt').innerText=roomId;document.getElementById('modal').classList.add('hidden');isHost=true;players=[myName,'B','C','D'];hostStartGame();}
function createRoom(){myName=document.getElementById('myName').value.trim();if(!myName){alert('Naam likho');return;}if(typeof Peer==='undefined'){alert('PeerJS load nahi - Reload karo');return;}roomId='TRUMP'+(rnd(9000)+1000);document.getElementById('roomIdTxt').innerText=roomId;document.getElementById('lobbyRoomCode').innerText=roomId;document.getElementById('waitingRoomCode').innerText=roomId;players=[myName];renderLobby();document.getElementById('modal').classList.add('hidden');document.getElementById('onlineLobby').classList.remove('hidden');document.getElementById('phase').innerText='Lobby: '+roomId;isHost=true;isBotGame=false;peer=new Peer(roomId,{config:{iceServers:[{urls:'stun:stun.l.google.com:19302'}]}});peer.on('open',()=>{document.getElementById('phase').innerText='Room Online: '+roomId;showToast('Room Online: '+roomId);});peer.on('connection',c=>{c.on('open',()=>{c.on('data',d=>handleData(d,c));conns[c.peer]=c;try{c.send({type:'lobby',players:players,roomId:roomId});}catch(e){}});});peer.on('error',()=>{document.getElementById('phase').innerText='Room: '+roomId;});}
function joinRoom(){myName=document.getElementById('myName').value.trim();if(!myName){alert('Naam likho');return;}let jid=document.getElementById('joinId').value.trim().toUpperCase();if(!jid){alert('Room ID likho');return;}roomId=jid;document.getElementById('roomIdTxt').innerText=roomId;document.getElementById('lobbyRoomCode').innerText=roomId;document.getElementById('waitingRoomCode').innerText=roomId;document.getElementById('modal').classList.add('hidden');document.getElementById('waitingLobby').classList.remove('hidden');document.getElementById('phase').innerText='Joining: '+roomId;let ws=document.getElementById('waitingStatus');if(ws)ws.innerText='Connecting...';isHost=false;players=[];peer=new Peer({config:{iceServers:[{urls:'stun:stun.l.google.com:19302'}]}});peer.on('open',()=>{let conn=peer.connect(roomId,{reliable:true});conn.on('open',()=>{conns[roomId]=conn;conn.on('data',d=>handleData(d));conn.send({type:'join',name:myName});if(ws)ws.innerText='Connected! Host wait...';});});}
function retryJoin(){try{if(peer)peer.destroy();}catch(e){}conns={};setTimeout(joinRoom,500);}
function addBotToLobby(){if(players.length>=4){alert('Room full');return;}let botNames=['B','C','D'];for(let n of botNames){if(players.indexOf(n)==-1)players.push(n);}if(players.length<4)players.push('Bot'+players.length);renderLobby();broadcast({type:'lobby',players:players,roomId:roomId});}
function hostStartFromLobby(){if(players.length<2){alert('2 player chahiye');return;}if(players.length<4){if(confirm(players.length+' player hai, bot bhar du?')){while(players.length<4){let b=players.indexOf('B')==-1?'B':players.indexOf('C')==-1?'C':players.indexOf('D')==-1?'D':'Bot'+players.length;players.push(b);}}}document.getElementById('onlineLobby').classList.add('hidden');broadcast({type:'startGame',players:players,roomId:roomId});hostStartGame();}
function leaveLobby(){document.getElementById('onlineLobby').classList.add('hidden');document.getElementById('waitingLobby').classList.add('hidden');document.getElementById('modal').classList.remove('hidden');players=[];roomId="";try{if(peer)peer.destroy();}catch(e){}conns={};peer=null;}
function broadcast(m){for(let k in conns){try{conns[k].send(m);}catch(e){}}}
function hostStartGame(){deck=mkDeck();hands={};bids={};trump="";center=[];trick=1;tricksWon={};for(let i=0;i<players.length;i++){let p=players[i];scores[p]=scores[p]||0;extra[p]=extra[p]||0;tricksWon[p]=0;}for(let i=0;i<players.length;i++){hands[players[i]]=deck.splice(0,5);}dealer=gameNo%players.length;bidder=(dealer+1)%players.length;document.getElementById('phase').innerText='Bidding...';broadcast({type:'deal',hands:hands,dealer:dealer,bidder:bidder,gameNo:gameNo,trump:"",bids:{},scores:scores,extra:extra,deck:deck,initialBidder:0,initialBid:0,overcallOrder:[],overcallIdx:0});updateUI();renderAll();let first=players[bidder];if(first==myName||!isBotPlayer(first))showBidModal(first,5,true);else setTimeout(botFirstBid,800);}
function botFirstBid(){let who=players[bidder];let hb=hands[who]||[];let cnt={};for(let c of hb)cnt[c.s]=(cnt[c.s]||0)+1;let best=suits[0],mx=0;for(let s of suits){if((cnt[s]||0)>mx){mx=cnt[s];best=s;}}let b=Math.max(1,Math.min(7,rnd(3)+3));trump=best;bids[who]=b;initialBid=b;initialBidder=bidder;overcallOrder=[];for(let i=1;i<=3;i++)overcallOrder.push((initialBidder+i)%players.length);overcallIdx=0;broadcast({type:'firstBid',trump:trump,bids:bids,bidder:bidder,initialBidder:initialBidder,initialBid:initialBid,overcallOrder:overcallOrder,overcallIdx:overcallIdx});updateUI();setTimeout(startOvercallPhase,500);}
function startOvercallPhase(){if(overcallIdx>=overcallOrder.length){dealRestHost();return;}let idx=overcallOrder[overcallIdx];let who=players[idx];if(isBotPlayer(who)){overcallIdx++;broadcast({type:'overcall',trump:trump,bids:bids,bidder:bidder,overcallOrder:overcallOrder,overcallIdx:overcallIdx});setTimeout(startOvercallPhase,300);}else{broadcast({type:'overcallRequest',who:who,trump:trump,bids:bids,bidder:bidder,overcallOrder:overcallOrder,overcallIdx:overcallIdx,initialBid:initialBid});}}
function handleData(data,connFrom){
if(data.type=='join'&&isHost){if(players.indexOf(data.name)===-1&&players.length<4){players.push(data.name);if(connFrom)conns[data.name]=connFrom;renderLobby();broadcast({type:'lobby',players:players,roomId:roomId});showToast(data.name+' joined');}}
if(data.type=='lobby'){players=data.players;roomId=data.roomId||roomId;renderLobby();document.getElementById('roomIdTxt').innerText=roomId;}
if(data.type=='startGame'){players=data.players;roomId=data.roomId||roomId;document.getElementById('waitingLobby').classList.add('hidden');document.getElementById('onlineLobby').classList.add('hidden');hostStartGame();}
if(data.type=='deal'){hands=data.hands;dealer=data.dealer;bidder=data.bidder;gameNo=data.gameNo;trump=data.trump||"";bids=data.bids||{};scores=data.scores;extra=data.extra;deck=data.deck||[];initialBidder=data.initialBidder||bidder;initialBid=data.initialBid||0;overcallOrder=data.overcallOrder||[];overcallIdx=data.overcallIdx||0;document.getElementById('modal').classList.add('hidden');document.getElementById('onlineLobby').classList.add('hidden');document.getElementById('waitingLobby').classList.add('hidden');updateUI();renderAll();if(Object.keys(bids).length==0){let f=players[bidder];if(f==myName)showBidModal(f,5,true);}}
if(data.type=='firstBid'){trump=data.trump;bids=data.bids;bidder=data.bidder;initialBidder=data.initialBidder;initialBid=data.initialBid;overcallOrder=data.overcallOrder;overcallIdx=data.overcallIdx;updateUI();if(isHost)setTimeout(startOvercallPhase,300);}
if(data.type=='overcall'){trump=data.trump;bids=data.bids;bidder=data.bidder;overcallOrder=data.overcallOrder;overcallIdx=data.overcallIdx;updateUI();if(isHost){if(overcallIdx>=overcallOrder.length)dealRestHost();else setTimeout(startOvercallPhase,300);}}
if(data.type=='overcallRequest'){if(data.who==myName)showOvercallModal();}
if(data.type=='bidRequest'){if(data.who==myName)showBidModal(myName,13,false);}
if(data.type=='bid'){bids=data.bids;updateUI();if(isHost&&Object.keys(bids).length>=players.length)startTricksHost();}
if(data.type=='play'){center=data.center;turn=data.turn;tricksWon=data.tricksWon;updateUI();renderAll();}
if(data.type=='playCard'){let c=data.card;let who=data.who;if(hands[who]){let idx=-1;for(let i=0;i<hands[who].length;i++)if(hands[who][i].id==c.id){idx=i;break;}if(idx>=0)hands[who].splice(idx,1);}center.push({s:c.s,r:c.r,p:c.p,id:c.id,who:who});renderAll();updateUI();if(isHost)nextTurnHost();}
if(data.type=='trickEnd'){tricksWon=data.tricksWon;turn=data.turn;trick=data.trick;center=data.center;updateUI();renderAll();}
if(data.type=='gameOver'){scores=data.scores;extra=data.extra;gameNo=data.nextGame;historyLog=data.historyLog;updateUI();}
if(data.type=='playerReplaced'){players=data.players;hands=data.hands;updateUI();renderAll();}
}
function showOvercallModal(){let sorted=[];for(let c of (hands[myName]||[]))sorted.push(c);sorted.sort(sortBySuit);document.getElementById('overcallModal').classList.remove('hidden');document.getElementById('overcallInfo').innerHTML='Trump: '+trump+' Bid: '+(bids[players[bidder]]||initialBid);let html='';for(let c of sorted)html+='<div class="card '+(c.s=='♥'||c.s=='♦'?'red':'black')+'"><div class="rank">'+c.r+'</div><div class="suit">'+c.s+'</div></div>';document.getElementById('overcallCards').innerHTML=html;let minBid=(bids[players[bidder]]||initialBid)+1;let opts='';for(let i=minBid;i<=10;i++)opts+='<option value="'+i+'">'+i+'</option>';document.getElementById('overcallBtns').innerHTML='Bid: <select id="overcallBidSel">'+opts+'</select> <button class="btn by" onclick="confirmOvercall()">Kaat Do</button> <button class="btn br" onclick="passOvercall()">Pass</button>';document.getElementById('overcallTrumpBtns').innerHTML='Trump: <button class="btn bg" onclick="setOvercallTmp(\'♠\')">♠</button><button class="btn bg" onclick="setOvercallTmp(\'♥\')">♥</button><button class="btn bg" onclick="setOvercallTmp(\'♦\')">♦</button><button class="btn bg" onclick="setOvercallTmp(\'♣\')">♣</button> <b id="overcallTmpShow">?</b>';}
let overcallTmp="";function setOvercallTmp(s){overcallTmp=s;document.getElementById('overcallTmpShow').innerText=s;}
function confirmOvercall(){let b=parseInt(document.getElementById('overcallBidSel').value);if(!overcallTmp){alert('Trump choose karo');return;}trump=overcallTmp;bids[myName]=b;bidder=players.indexOf(myName);document.getElementById('overcallModal').classList.add('hidden');overcallTmp="";overcallIdx++;broadcast({type:'overcall',trump:trump,bids:bids,bidder:bidder,overcallOrder:overcallOrder,overcallIdx:overcallIdx});updateUI();if(isHost)setTimeout(startOvercallPhase,400);}
function passOvercall(){document.getElementById('overcallModal').classList.add('hidden');overcallTmp="";overcallIdx++;broadcast({type:'overcall',trump:trump,bids:bids,bidder:bidder,overcallOrder:overcallOrder,overcallIdx:overcallIdx});updateUI();if(isHost)setTimeout(startOvercallPhase,300);}
function dealRestHost(){document.getElementById('overcallModal').classList.add('hidden');for(let i=0;i<players.length;i++){let p=players[i];if(hands[p]&&hands[p].length===5)hands[p]=hands[p].concat(deck.splice(0,8));}deck=[];broadcast({type:'deal',hands:hands,dealer:dealer,bidder:bidder,gameNo:gameNo,trump:trump,bids:bids,scores:scores,extra:extra,deck:[],initialBidder:initialBidder,initialBid:initialBid,overcallOrder:[],overcallIdx:0});updateUI();renderAll();let next=(bidder+1)%players.length;checkBidsAndContinue(next);}
function checkBidsAndContinue(startIdx){if(Object.keys(bids).length>=players.length){if(isHost)startTricksHost();return;}let idx=startIdx;let who=players[idx];if(bids[who]==null){if(who==myName)showBidModal(who,13,false);else if(isBotPlayer(who)&&isHost){let hb=hands[who]||[];let b=Math.max(1,Math.min(8,rnd(3)+2));bids[who]=b;broadcast({type:'bid',bids:bids});updateUI();if(Object.keys(bids).length>=players.length)startTricksHost();}else if(isHost)broadcast({type:'bidRequest',who:who,trump:trump,bids:bids});}}
function startTricksHost(){turn=bidder;trick=1;center=[];tricksWon={};for(let i=0;i<players.length;i++)tricksWon[players[i]]=0;document.getElementById('uiBox').classList.add('hideGame');broadcast({type:'play',center:center,turn:turn,tricksWon:tricksWon});updateUI();renderAll();startTurnTimer();if(isBotPlayer(players[turn]))setTimeout(botPlay,700);}
function showBidModal(who,cnt,isFirst){document.getElementById('bidModal').classList.remove('hidden');let sorted=[];for(let c of (hands[who]||[]))sorted.push(c);sorted.sort(sortBySuit);document.getElementById('bidRoundInfo').innerText=isFirst?'5 patte dekh ke Trump+Bid':'Bid';document.getElementById('bidTrumpInfo').innerHTML=trump?'Trump: '+trump:'Trump choose karo';document.getElementById('bidTitle').innerText=who+' - '+cnt+' patte';let html='';for(let i=0;i<Math.min(cnt,sorted.length);i++){let c=sorted[i];html+='<div class="card '+(c.s=='♥'||c.s=='♦'?'red':'black')+'"><div class="rank">'+c.r+'</div><div class="suit">'+c.s+'</div></div>';}document.getElementById('bidCards').innerHTML=html;let opts='';for(let i=1;i<=7;i++)opts+='<option value="'+i+'" '+(i==4?'selected':'')+'>'+i+'</option>';document.getElementById('bidBtns').innerHTML='Bid: <select id="bidSel">'+opts+'</select> <button class="btn by" onclick="confirmBid('+isFirst+')">Lock</button>';document.getElementById('trumpBtns').innerHTML=isFirst?'Trump: <button class="btn bg" onclick="setTmp(\'♠\')">♠</button><button class="btn bg" onclick="setTmp(\'♥\')">♥</button><button class="btn bg" onclick="setTmp(\'♦\')">♦</button><button class="btn bg" onclick="setTmp(\'♣\')">♣</button> <b id="tmpShow">?</b>':'';}
let tmpT="";function setTmp(s){tmpT=s;document.getElementById('tmpShow').innerText=s}
function confirmBid(isFirst){let b=parseInt(document.getElementById('bidSel').value);if(isFirst){if(!tmpT){alert('Trump choose karo');return}trump=tmpT;bids[myName]=b;initialBid=b;initialBidder=players.indexOf(myName);overcallOrder=[];for(let i=1;i<=3;i++)overcallOrder.push((initialBidder+i)%players.length);overcallIdx=0;document.getElementById('bidModal').classList.add('hidden');tmpT="";broadcast({type:'firstBid',trump:trump,bids:bids,bidder:bidder,initialBidder:initialBidder,initialBid:initialBid,overcallOrder:overcallOrder,overcallIdx:overcallIdx});updateUI();if(isHost)setTimeout(startOvercallPhase,500);}else{bids[myName]=b;document.getElementById('bidModal').classList.add('hidden');broadcast({type:'bid',bids:bids});updateUI();}}
function updateUI(){document.getElementById('gno').innerText=gameNo;document.getElementById('dealer').innerText=players[dealer]||'-';document.getElementById('bidder').innerText=players[bidder]||'-';document.getElementById('trump').innerText=trump||'?';let tc=document.getElementById('trumpCenter');if(tc){tc.innerText=trump||'';}let tb=document.getElementById('trumpBadge');if(tb){tb.innerText=trump?'TRUMP: '+trump:'TRUMP: ?';}let bar=document.getElementById('turnBar');if(players[turn]==myName){bar.classList.remove('hidden');bar.innerText='Your turn!';}else{bar.classList.add('hidden');}let bhtml='';for(let i=0;i<players.length;i++){let p=players[i];bhtml+=p+':Bid '+(bids[p]!=null?bids[p]:'-')+' ';}document.getElementById('bids').innerHTML=bhtml;for(let i=0;i<4;i++){let id=["A","B","C","D"][i];let p=players[i];if(!p)continue;let tag=document.getElementById('tag-'+id);if(tag){let b=bids[p]!=null?bids[p]:'-';let w=tricksWon[p]!=null?tricksWon[p]:0;tag.innerHTML=p+'<br><b>'+b+'/'+w+'</b>';}let av=document.getElementById('av-'+id);if(av){av.innerText=p[0];if(i==turn)av.classList.add('active');else av.classList.remove('active');}}for(let i=0;i<players.length;i++){let p=players[i];let pe=document.getElementById('p'+i);if(pe)pe.innerText=p||["A","B","C","D"][i];}}
function getValidCards(hand){if(center.length==0){let arr=[];for(let i=0;i<hand.length;i++)arr.push(i);return arr;}let lead=center[0].s;let has=false;for(let i=0;i<hand.length;i++)if(hand[i].s==lead)has=true;if(has){let arr=[];for(let i=0;i<hand.length;i++)if(hand[i].s==lead)arr.push(i);return arr;}let arr2=[];for(let i=0;i<hand.length;i++)arr2.push(i);return arr2;}
function renderAll(){for(let pi=0;pi<players.length;pi++){let p=players[pi];let id=["A","B","C","D"][pi];let cont=document.getElementById('hand-'+id);if(!cont)continue;let h=[];for(let c of (hands[p]||[]))h.push(c);h.sort(sortBySuit);if(p==myName||pi==0||!isBotPlayer(p)){let html='';for(let idx=0;idx<h.length;idx++){let c=h[idx];let click=(p==myName)?'onclick="playCardById(\''+c.id+'\')"':'';html+='<div class="card '+(c.s=='♥'||c.s=='♦'?'red':'black')+'" '+click+'><div class="rank">'+c.r+'</div><div class="suit">'+c.s+'</div></div>';}cont.innerHTML=html;}else{let html='';for(let i=0;i<h.length;i++)html+='<div class="card back"></div>';cont.innerHTML=html;}}let cc=document.getElementById('centerCards');if(cc){let html='';for(let i=0;i<center.length;i++){let c=center[i];let idx=0;for(let k=0;k<players.length;k++)if(players[k]==c.who)idx=k;let posClass=idx==0?'pos-A':idx==1?'pos-B':idx==2?'pos-C':'pos-D';html+='<div class="card '+(c.s=='♥'||c.s=='♦'?'red':'black')+' '+posClass+'"><div class="rank">'+c.r+'</div><div class="suit">'+c.s+'</div><div class="whoLabel">'+c.who+'</div></div>';}cc.innerHTML=html;}}
function playCardById(cardId){let hand=hands[myName]||[];if(players[turn]!=myName){showToast('NOT YOUR TURN');return;}let cardToPlay=null;let realIdx=-1;for(let i=0;i<hand.length;i++){if(hand[i].id==cardId){cardToPlay=hand[i];realIdx=i;break;}}if(!cardToPlay)return;if(center.some(c=>c.who==myName)){showToast('Already played!');return;}if(center.length>0){let lead=center[0].s;let has=false;for(let c of hand)if(c.s==lead)has=true;if(has&&cardToPlay.s!=lead){showToast('Rule: '+lead+' dalo!');return;}}clearTurnTimer();hand.splice(realIdx,1);center.push({s:cardToPlay.s,r:cardToPlay.r,p:cardToPlay.p,id:cardToPlay.id,who:myName});renderAll();updateUI();if(isHost)nextTurnHost();else broadcast({type:'playCard',card:cardToPlay,who:myName});}
function botPlay(){let who=players[turn];let h=hands[who];if(!h)return;let validIdx=getValidCards(h);let chosenIdx=validIdx[rnd(validIdx.length)];let card=h[chosenIdx];let idx=-1;for(let i=0;i<h.length;i++)if(h[i].id===card.id){idx=i;break;}if(idx>=0)h.splice(idx,1);clearTurnTimer();center.push({s:card.s,r:card.r,p:card.p,id:card.id,who:who});nextTurnHost();}
function nextTurnHost(){if(!isHost)return;clearTurnTimer();turn=(turn+1)%players.length;renderAll();updateUI();if(center.length<4){broadcast({type:'play',center:center,turn:turn,tricksWon:tricksWon});startTurnTimer();if(isBotPlayer(players[turn]))setTimeout(botPlay,700);}else setTimeout(endTrickHost,1100);}
function endTrickHost(){let lead=center[0].s;let win=center[0];for(let i=1;i<center.length;i++){let c=center[i];if(c.s==trump&&win.s!=trump)win=c;else if(c.s==trump&&win.s==trump&&c.p>win.p)win=c;else if(c.s==lead&&win.s==lead&&win.s!=trump&&c.p>win.p)win=c;}tricksWon[win.who]=(tricksWon[win.who]||0)+1;setTimeout(function(){center=[];let winIdx=0;for(let i=0;i<players.length;i++)if(players[i]==win.who)winIdx=i;turn=winIdx;trick++;broadcast({type:'trickEnd',tricksWon:tricksWon,turn:turn,trick:trick,center:center});updateUI();renderAll();startTurnTimer();if(trick>13)setTimeout(endGameHost,500);else if(isBotPlayer(players[turn]))setTimeout(botPlay,700);},700);}
function endGameHost(){let roundEntries=[];for(let i=0;i<players.length;i++){let p=players[i];let bid=bids[p];let won=tricksWon[p];let delta=0;if(won>=bid){delta=bid*10+(won-bid);scores[p]+=delta;extra[p]+=(won-bid);}else{delta=-bid*10;scores[p]+=delta;}roundEntries.push({round:gameNo,player:p,bid:bid,won:won,delta:delta,total:scores[p],bag:extra[p]});if(extra[p]>=10){scores[p]-=100;extra[p]-=10;}}historyLog=historyLog.concat(roundEntries);let nextGame=gameNo+1;broadcast({type:'gameOver',scores:scores,extra:extra,nextGame:nextGame,historyLog:historyLog});}
function showHistory(){document.getElementById('historyModal').classList.remove('hidden');}
function closeHistory(){document.getElementById('historyModal').classList.add('hidden');}
function nextRoundStart(){closeHistory();if(isHost)hostStartGame();}
function showFinal(){}
function copyRoom(){try{navigator.clipboard.writeText(roomId);alert('Room: '+roomId);}catch(e){alert('Room: '+roomId);}}
function shareWA(){let txt='Trump khelo Room: '+roomId+' Link: '+location.href;window.open('https://wa.me/?text='+encodeURIComponent(txt));}
